name: "🐞 Something is not working"
description: "Tell us about anything that looks, feels or behaves differently than expected."
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
# Welcome 👋

Thank you for taking the time to help improve ReplicaFlow.

Whether you've discovered a small visual issue or a critical problem,
you're helping make ReplicaFlow better for everyone.

---

## Thank you for helping us improve ReplicaFlow

Every report helps us make ReplicaFlow clearer, safer and more reliable.

A bug can be anything that does not look, feel or behave as expected:
- a button that does nothing
- an incorrect translation
- a visual problem
- unexpected data
- confusing behavior
- a technical failure

You do not need to know why it happened.

Just tell us what you experienced.

**Together we'll figure out the rest.**

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Please describe what you saw or experienced in your own words."
      placeholder: |
        I clicked...
        Then I expected...
        Instead...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "What did you expect to happen?"
      description: "Tell us what you thought ReplicaFlow should have done."
      placeholder: "I expected..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Can you help us reproduce it?"
      description: |
        Please describe what you did before the problem appeared.
        Even a few simple steps can help us understand the issue.
      placeholder: |
        1. Open...
        2. Click...
        3. Select...
        4. The problem appears...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: "Where did you notice the problem?"
      description: "Choose the area that seems closest. It is okay if you are unsure."
      options:
        - "User interface or layout"
        - "Button, menu or interaction"
        - "Visualization or Information Flow"
        - "Replication or data consistency"
        - "Monitoring or status information"
        - "Translation or wording"
        - "Performance"
        - "Installation or configuration"
        - "Documentation"
        - "Something else"
        - "I am not sure"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "How often does it happen?"
      description: "An estimate is completely fine."
      options:
        - "Every time"
        - "Often"
        - "Sometimes"
        - "Only once so far"
        - "I am not sure"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Where did this happen?"
      description: |
        Share anything you know about your environment.
        For example: operating system, browser, ReplicaFlow version,
        database type or deployment method.
      placeholder: |
        ReplicaFlow version:
        Operating system:
        Browser:
        Database:
        Deployment:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: "Screenshots, logs or other helpful information"
      description: |
        Add screenshots, logs, error messages or recordings if they help explain the problem.

        Please remove passwords, access tokens, personal data and other sensitive information before posting.
      placeholder: "Drag files here or paste additional information."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "Is there anything else we should know?"
      description: |
        Share any additional context, observations or ideas that may help the community understand the issue.
    validations:
      required: false

  - type: checkboxes
    id: community
    attributes:
      label: "Community agreement"
      description: "Before submitting, please confirm the following."
      options:
        - label: "I have described the issue as clearly as I can."
          required: true
        - label: "I have removed passwords, access tokens and other sensitive information."
          required: true
        - label: "I understand that questions from the community are part of solving the issue together."
          required: true
